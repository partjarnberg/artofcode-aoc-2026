name: Publicera Advent-lösningar
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: advent-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Registrera repo och kodversion
        env:
          ADVENT_API_URL: ${{ vars.ADVENT_API_URL || 'https://aoc.artofcode.se/api/v1/github/push' }}
        run: python3 .github/scripts/publish.py
